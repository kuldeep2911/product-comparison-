services:
  - type: web
    name: assistme-backend
    env: python
    region: singapore        # closest to India
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false          # paste Supabase connection string in Render dashboard
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_DAYS
        value: "30"
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false          # paste your Vercel URL here after deploying frontend
